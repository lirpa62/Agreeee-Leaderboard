# /etc/nginx/sites-available/agreeee-api
#
# HTTPS 종단 + 리버스 프록시.
# certbot 이 443 블록을 자동으로 추가하므로, 처음에는 80 만 두고
# `sudo certbot --nginx -d api.example.com` 을 실행하면 됩니다.

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;   # ← 실제 도메인으로 변경

    # 업로드 없음 — 제출 본문은 작습니다.
    client_max_body_size 64k;

    # 관리자 화면은 공개할 필요가 없다면 IP 로 제한하세요.
    # location /admin/ {
    #     allow 1.2.3.4;    # ← 본인 IP
    #     deny all;
    #     proxy_pass http://127.0.0.1:3000;
    # }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 서버가 app.set("trust proxy", 1) 이므로 요청 제한이 실제 IP 기준으로 동작합니다.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }
}
