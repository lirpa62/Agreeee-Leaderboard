<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>관리자 로그인 - 리더보드</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body class="login-page">
    <form class="xp-window login-box" id="loginForm">
      <div class="xp-titlebar">
        <span class="xp-titlebar-icon">🔒</span>
        <span class="xp-titlebar-text">관리자 로그인</span>
      </div>
      <div class="xp-window-body">
        <p class="login-msg">관리자 비밀번호를 입력하세요.</p>
        <input
          type="password"
          id="password"
          class="xp-input"
          autocomplete="current-password"
          required
        />
        <p class="error" id="error"></p>
        <div class="row-end">
          <button type="submit" class="xp-button">확인</button>
        </div>
      </div>
    </form>
    <script src="login.js"></script>
  </body>
</html>
